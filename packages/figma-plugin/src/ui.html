<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DTCG Token Manager</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        font-size: 12px;
        color: var(--figma-color-text, #1a1a1a);
        background: var(--figma-color-bg, #ffffff);
        padding: 16px;
        line-height: 1.5;
      }

      h1 {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 4px;
      }

      .subtitle {
        font-size: 11px;
        color: var(--figma-color-text-secondary, #666);
        margin-bottom: 12px;
      }

      /* --- Tabs --- */
      .tab-bar {
        display: flex;
        gap: 0;
        margin-bottom: 16px;
        border-bottom: 1px solid var(--figma-color-border, #e0e0e0);
      }

      .tab-btn {
        flex: 1;
        padding: 8px 0;
        border: none;
        background: none;
        font-size: 12px;
        font-weight: 600;
        color: var(--figma-color-text-secondary, #666);
        cursor: pointer;
        border-bottom: 2px solid transparent;
        transition:
          color 0.1s,
          border-color 0.1s;
      }

      .tab-btn:hover {
        color: var(--figma-color-text, #1a1a1a);
      }

      .tab-btn.active {
        color: var(--figma-color-text-brand, #007aff);
        border-bottom-color: var(--figma-color-bg-brand, #007aff);
      }

      .tab-panel {
        display: none;
      }

      .tab-panel.active {
        display: block;
      }

      /* --- Shared --- */
      .section-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--figma-color-text-secondary, #666);
        margin-bottom: 8px;
      }

      .collection-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 16px;
      }

      .collection-card {
        border: 1px solid var(--figma-color-border, #e0e0e0);
        border-radius: 6px;
        overflow: hidden;
      }

      .collection-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: var(--figma-color-bg-secondary, #f5f5f5);
        font-weight: 600;
      }

      .btn-export-mode {
        padding: 3px 10px;
        border: 1px solid var(--figma-color-border, #e0e0e0);
        border-radius: 4px;
        background: var(--figma-color-bg, #fff);
        color: var(--figma-color-text, #1a1a1a);
        font-size: 10px;
        font-weight: 600;
        cursor: pointer;
        flex-shrink: 0;
        transition: background 0.1s;
      }

      .btn-export-mode:hover {
        background: var(--figma-color-bg-secondary, #f5f5f5);
      }

      .btn-export-mode:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .collection-name {
        flex: 1;
      }

      .mode-list {
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      .mode-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-top: 1px solid var(--figma-color-border, #e0e0e0);
      }

      .mode-name {
        min-width: 60px;
        color: var(--figma-color-text-secondary, #666);
      }

      .mode-arrow {
        color: var(--figma-color-text-tertiary, #999);
        font-size: 10px;
      }

      .file-name-input {
        flex: 1;
        border: 1px solid var(--figma-color-border, #e0e0e0);
        border-radius: 4px;
        padding: 3px 6px;
        font-size: 11px;
        font-family: 'SF Mono', 'Fira Code', monospace;
        background: var(--figma-color-bg, #fff);
        color: var(--figma-color-text, #1a1a1a);
      }

      .file-name-input:focus {
        outline: 2px solid var(--figma-color-border-selected, #007aff);
        outline-offset: -1px;
        border-color: transparent;
      }

      .text-input {
        border: 1px solid var(--figma-color-border, #e0e0e0);
        border-radius: 4px;
        padding: 3px 6px;
        font-size: 11px;
        background: var(--figma-color-bg, #fff);
        color: var(--figma-color-text, #1a1a1a);
      }

      .text-input:focus {
        outline: 2px solid var(--figma-color-border-selected, #007aff);
        outline-offset: -1px;
        border-color: transparent;
      }

      .stats-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        background: var(--figma-color-bg-secondary, #f5f5f5);
        border-radius: 6px;
        margin-bottom: 16px;
        font-size: 11px;
        color: var(--figma-color-text-secondary, #666);
      }

      .stats-count {
        font-weight: 600;
        color: var(--figma-color-text, #1a1a1a);
      }

      .actions {
        display: flex;
        gap: 8px;
      }

      .btn {
        flex: 1;
        padding: 8px 16px;
        border: none;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.1s;
      }

      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .btn-primary {
        background: var(--figma-color-bg-brand, #007aff);
        color: #fff;
      }

      .btn-primary:not(:disabled):hover {
        opacity: 0.85;
      }

      .btn-secondary {
        background: var(--figma-color-bg-secondary, #f0f0f0);
        color: var(--figma-color-text, #1a1a1a);
      }

      .btn-secondary:not(:disabled):hover {
        background: var(--figma-color-bg-tertiary, #e4e4e4);
      }

      .message {
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 11px;
        margin-bottom: 12px;
        display: none;
      }

      .message.visible {
        display: block;
      }

      .message-error {
        background: #fff0f0;
        color: #cc0000;
        border: 1px solid #ffcccc;
      }

      .message-success {
        background: #f0fff4;
        color: #007700;
        border: 1px solid #ccffdd;
      }

      .message-warning {
        background: #fffbf0;
        color: #996600;
        border: 1px solid #ffe0a0;
      }

      .warning-list {
        margin: 4px 0 0;
        padding-left: 16px;
        list-style: disc;
      }

      .loading {
        text-align: center;
        color: var(--figma-color-text-secondary, #666);
        padding: 24px 0;
      }

      .spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid var(--figma-color-border, #e0e0e0);
        border-top-color: var(--figma-color-bg-brand, #007aff);
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        vertical-align: middle;
        margin-right: 6px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .hidden {
        display: none !important;
      }

      /* --- Import-specific --- */
      .drop-zone {
        border: 2px dashed var(--figma-color-border, #e0e0e0);
        border-radius: 8px;
        padding: 24px 16px;
        text-align: center;
        color: var(--figma-color-text-secondary, #666);
        margin-bottom: 16px;
        cursor: pointer;
        transition:
          border-color 0.15s,
          background 0.15s;
      }

      .drop-zone:hover,
      .drop-zone.dragover {
        border-color: var(--figma-color-bg-brand, #007aff);
        background: var(--figma-color-bg-secondary, #f5f5f5);
      }

      .drop-zone-text {
        font-size: 12px;
        margin-bottom: 4px;
      }

      .drop-zone-hint {
        font-size: 10px;
        color: var(--figma-color-text-tertiary, #999);
      }

      .import-file-card {
        border: 1px solid var(--figma-color-border, #e0e0e0);
        border-radius: 6px;
        padding: 10px 12px;
        margin-bottom: 8px;
      }

      .import-file-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      .import-file-name {
        font-weight: 600;
        font-size: 11px;
        font-family: 'SF Mono', 'Fira Code', monospace;
      }

      .import-file-tokens {
        font-size: 10px;
        color: var(--figma-color-text-secondary, #666);
      }

      .import-file-remove {
        background: none;
        border: none;
        color: var(--figma-color-text-tertiary, #999);
        cursor: pointer;
        font-size: 14px;
        padding: 0 4px;
        line-height: 1;
      }

      .import-file-remove:hover {
        color: #cc0000;
      }

      .import-file-fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .import-field-label {
        font-size: 10px;
        color: var(--figma-color-text-secondary, #666);
        margin-bottom: 2px;
      }
    </style>
  </head>
  <body>
    <h1>DTCG Token Manager</h1>
    <p class="subtitle">Import &amp; Export Figma Variables as DTCG JSON</p>

    <!-- Tab bar -->
    <div class="tab-bar" role="tablist">
      <button class="tab-btn active" role="tab" data-tab="export" aria-selected="true">
        Export
      </button>
      <button class="tab-btn" role="tab" data-tab="import" aria-selected="false">Import</button>
    </div>

    <!-- ================================================================= -->
    <!-- EXPORT TAB -->
    <!-- ================================================================= -->
    <div id="tab-export" class="tab-panel active" role="tabpanel">
      <div id="export-loading" class="loading">
        <span class="spinner"></span>Loading collections\u2026
      </div>

      <div id="export-main" class="hidden">
        <div id="export-msg-error" class="message message-error"></div>
        <div id="export-msg-warning" class="message message-warning"></div>
        <div id="export-msg-success" class="message message-success"></div>

        <div class="stats-bar">
          <span>Total variables</span>
          <span class="stats-count" id="export-total-count">\u2014</span>
        </div>

        <p class="section-label">Collections &amp; Output Files</p>
        <div class="collection-list" id="export-collection-list"></div>

        <div class="actions">
          <button class="btn btn-secondary" id="btn-reload">Reload</button>
        </div>
      </div>
    </div>

    <!-- ================================================================= -->
    <!-- IMPORT TAB -->
    <!-- ================================================================= -->
    <div id="tab-import" class="tab-panel" role="tabpanel">
      <div id="import-msg-error" class="message message-error"></div>
      <div id="import-msg-warning" class="message message-warning"></div>
      <div id="import-msg-success" class="message message-success"></div>

      <div id="import-drop-zone" class="drop-zone">
        <div class="drop-zone-text">Drop DTCG JSON files here</div>
        <div class="drop-zone-hint">or click to browse</div>
        <input type="file" id="import-file-input" accept=".json" multiple style="display: none" />
      </div>

      <div id="import-file-list"></div>

      <div class="actions">
        <button class="btn btn-secondary" id="btn-import-clear" disabled>Clear</button>
        <button class="btn btn-primary" id="btn-import" disabled>Import JSON</button>
      </div>
    </div>

    <script>
      // =======================================================================
      // Tab switching
      // =======================================================================
      var tabBtns = document.querySelectorAll('.tab-btn')
      tabBtns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          tabBtns.forEach(function (b) {
            b.classList.remove('active')
            b.setAttribute('aria-selected', 'false')
          })
          btn.classList.add('active')
          btn.setAttribute('aria-selected', 'true')
          document.querySelectorAll('.tab-panel').forEach(function (p) {
            p.classList.remove('active')
          })
          document.getElementById('tab-' + btn.dataset.tab).classList.add('active')
        })
      })

      // =======================================================================
      // EXPORT — State & DOM
      // =======================================================================
      var exportState = { mappings: [], totalTokenCount: 0 }

      var elExportLoading = document.getElementById('export-loading')
      var elExportMain = document.getElementById('export-main')
      var elExportList = document.getElementById('export-collection-list')
      var elExportTotal = document.getElementById('export-total-count')
      var elBtnReload = document.getElementById('btn-reload')
      var elExportError = document.getElementById('export-msg-error')
      var elExportWarning = document.getElementById('export-msg-warning')
      var elExportSuccess = document.getElementById('export-msg-success')
      // Track which mode button is currently exporting
      var activeExportBtn = null

      // =======================================================================
      // EXPORT — Helpers
      // =======================================================================
      function showMsg(el, msg) {
        el.textContent = msg
        el.classList.add('visible')
      }

      function hideMsg(el) {
        el.classList.remove('visible')
      }

      function showWarningsList(el, warnings) {
        if (!warnings || warnings.length === 0) {
          hideMsg(el)
          return
        }
        el.innerHTML = ''
        var title = document.createElement('strong')
        title.textContent = warnings.length + ' warning(s):'
        el.appendChild(title)
        var ul = document.createElement('ul')
        ul.className = 'warning-list'
        warnings.forEach(function (w) {
          var li = document.createElement('li')
          li.textContent = w.message
          ul.appendChild(li)
        })
        el.appendChild(ul)
        el.classList.add('visible')
      }

      function clearExportMessages() {
        hideMsg(elExportError)
        hideMsg(elExportWarning)
        hideMsg(elExportSuccess)
      }

      // =======================================================================
      // EXPORT — Render
      // =======================================================================
      function exportSingleMode(colIdx, mIdx) {
        clearExportMessages()
        var mapping = exportState.mappings[colIdx]
        // Build a payload with only the target mode enabled
        var payload = [
          {
            collectionId: mapping.collectionId,
            collectionName: mapping.collectionName,
            modes: mapping.modes.map(function (m, i) {
              return {
                modeId: m.modeId,
                modeName: m.modeName,
                fileName: m.fileName,
                enabled: i === mIdx,
              }
            }),
          },
        ]
        parent.postMessage({ pluginMessage: { type: 'export', mappings: payload } }, '*')
      }

      function renderExport() {
        elExportList.innerHTML = ''

        exportState.mappings.forEach(function (mapping, colIdx) {
          var card = document.createElement('div')
          card.className = 'collection-card'

          var header = document.createElement('div')
          header.className = 'collection-header'

          var colName = document.createElement('span')
          colName.className = 'collection-name'
          colName.textContent = mapping.collectionName

          header.appendChild(colName)
          card.appendChild(header)

          var modeList = document.createElement('div')
          modeList.className = 'mode-list'

          mapping.modes.forEach(function (mode, mIdx) {
            var row = document.createElement('div')
            row.className = 'mode-row'

            var modeName = document.createElement('span')
            modeName.className = 'mode-name'
            modeName.textContent = mode.modeName

            var arrow = document.createElement('span')
            arrow.className = 'mode-arrow'
            arrow.textContent = '\u2192'

            var fileInput = document.createElement('input')
            fileInput.type = 'text'
            fileInput.className = 'file-name-input'
            fileInput.setAttribute('aria-label', 'Output filename for mode: ' + mode.modeName)
            fileInput.placeholder = 'filename.json'
            fileInput.value = mode.fileName
            fileInput.addEventListener('input', function () {
              exportState.mappings[colIdx].modes[mIdx].fileName = fileInput.value
            })

            var exportBtn = document.createElement('button')
            exportBtn.className = 'btn-export-mode'
            exportBtn.textContent = 'Export'
            exportBtn.setAttribute('aria-label', 'Export ' + mode.modeName)
            exportBtn.addEventListener('click', function () {
              activeExportBtn = exportBtn
              exportBtn.disabled = true
              exportBtn.textContent = '\u2026'
              exportSingleMode(colIdx, mIdx)
            })

            row.appendChild(modeName)
            row.appendChild(arrow)
            row.appendChild(fileInput)
            row.appendChild(exportBtn)
            modeList.appendChild(row)
          })

          card.appendChild(modeList)
          elExportList.appendChild(card)
        })

        elExportTotal.textContent = String(exportState.totalTokenCount)
      }

      // =======================================================================
      // EXPORT — Download
      // =======================================================================
      function downloadJson(fileName, content) {
        var json = JSON.stringify(content, null, 2)
        var blob = new Blob([json], { type: 'application/json' })
        var url = URL.createObjectURL(blob)
        var a = document.createElement('a')
        a.href = url
        a.download = fileName
        document.body.appendChild(a)
        a.click()
        document.body.removeChild(a)
        URL.revokeObjectURL(url)
      }

      // =======================================================================
      // EXPORT — Button handlers
      // =======================================================================
      elBtnReload.addEventListener('click', function () {
        clearExportMessages()
        elExportMain.classList.add('hidden')
        elExportLoading.classList.remove('hidden')
        parent.postMessage({ pluginMessage: { type: 'load-collections' } }, '*')
      })

      // =======================================================================
      // IMPORT — State & DOM
      // =======================================================================
      var importState = { files: [] }

      var elImportError = document.getElementById('import-msg-error')
      var elImportWarning = document.getElementById('import-msg-warning')
      var elImportSuccess = document.getElementById('import-msg-success')
      var elDropZone = document.getElementById('import-drop-zone')
      var elFileInput = document.getElementById('import-file-input')
      var elImportFileList = document.getElementById('import-file-list')
      var elBtnImport = document.getElementById('btn-import')
      var elBtnImportClear = document.getElementById('btn-import-clear')

      // =======================================================================
      // IMPORT — Helpers
      // =======================================================================
      function countTokensInGroup(obj) {
        var count = 0
        for (var key in obj) {
          if (key.charAt(0) === '$') continue
          var val = obj[key]
          if (val && typeof val === 'object' && '$value' in val && '$type' in val) {
            count++
          } else if (val && typeof val === 'object') {
            count += countTokensInGroup(val)
          }
        }
        return count
      }

      function deriveCollectionName(fileName) {
        // "semantic-dark.json" → "Semantic"   (strip mode suffix heuristic)
        // "primitives.json"   → "Primitives"
        var base = fileName.replace(/\.json$/i, '')
        // Capitalize first letter
        return base.charAt(0).toUpperCase() + base.slice(1)
      }

      function deriveModeName(fileName) {
        // "semantic-dark.json" → "Dark"
        // "primitives.json"   → "Value"
        var base = fileName.replace(/\.json$/i, '')
        var parts = base.split('-')
        if (parts.length > 1) {
          var mode = parts[parts.length - 1]
          return mode.charAt(0).toUpperCase() + mode.slice(1)
        }
        return 'Value'
      }

      function clearImportMessages() {
        hideMsg(elImportError)
        hideMsg(elImportWarning)
        hideMsg(elImportSuccess)
      }

      function updateImportButtons() {
        var hasFiles = importState.files.length > 0
        elBtnImport.disabled = !hasFiles
        elBtnImportClear.disabled = !hasFiles
      }

      // =======================================================================
      // IMPORT — File handling
      // =======================================================================
      function handleFiles(fileList) {
        clearImportMessages()
        Array.from(fileList).forEach(function (file) {
          if (!file.name.endsWith('.json')) {
            showMsg(elImportError, '"' + file.name + '" is not a JSON file.')
            return
          }
          var reader = new FileReader()
          reader.onload = function (e) {
            try {
              var content = JSON.parse(e.target.result)
              var tokenCount = countTokensInGroup(content)
              if (tokenCount === 0) {
                showMsg(elImportError, '"' + file.name + '": no DTCG tokens found ($value/$type).')
                return
              }
              importState.files.push({
                fileName: file.name,
                content: content,
                collectionName: deriveCollectionName(file.name),
                modeName: deriveModeName(file.name),
                tokenCount: tokenCount,
              })
              renderImport()
            } catch (err) {
              showMsg(elImportError, '"' + file.name + '": invalid JSON \u2014 ' + err.message)
            }
          }
          reader.readAsText(file)
        })
      }

      // Drop zone events
      elDropZone.addEventListener('click', function () {
        elFileInput.click()
      })
      elFileInput.addEventListener('change', function () {
        if (elFileInput.files.length) handleFiles(elFileInput.files)
        elFileInput.value = ''
      })
      elDropZone.addEventListener('dragover', function (e) {
        e.preventDefault()
        elDropZone.classList.add('dragover')
      })
      elDropZone.addEventListener('dragleave', function () {
        elDropZone.classList.remove('dragover')
      })
      elDropZone.addEventListener('drop', function (e) {
        e.preventDefault()
        elDropZone.classList.remove('dragover')
        if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files)
      })

      // =======================================================================
      // IMPORT — Render
      // =======================================================================
      function renderImport() {
        elImportFileList.innerHTML = ''

        importState.files.forEach(function (file, idx) {
          var card = document.createElement('div')
          card.className = 'import-file-card'

          // Header row
          var header = document.createElement('div')
          header.className = 'import-file-header'

          var nameWrap = document.createElement('div')
          var nameEl = document.createElement('span')
          nameEl.className = 'import-file-name'
          nameEl.textContent = file.fileName
          var tokensEl = document.createElement('span')
          tokensEl.className = 'import-file-tokens'
          tokensEl.textContent = ' \u2014 ' + file.tokenCount + ' tokens'
          nameWrap.appendChild(nameEl)
          nameWrap.appendChild(tokensEl)

          var removeBtn = document.createElement('button')
          removeBtn.className = 'import-file-remove'
          removeBtn.setAttribute('aria-label', 'Remove ' + file.fileName)
          removeBtn.textContent = '\u00d7'
          removeBtn.addEventListener('click', function () {
            importState.files.splice(idx, 1)
            renderImport()
          })

          header.appendChild(nameWrap)
          header.appendChild(removeBtn)
          card.appendChild(header)

          // Fields
          var fields = document.createElement('div')
          fields.className = 'import-file-fields'

          // Collection name
          var colGroup = document.createElement('div')
          var colLabel = document.createElement('div')
          colLabel.className = 'import-field-label'
          colLabel.textContent = 'Collection'
          var colInput = document.createElement('input')
          colInput.type = 'text'
          colInput.className = 'text-input'
          colInput.setAttribute('aria-label', 'Collection name for ' + file.fileName)
          colInput.value = file.collectionName
          colInput.style.width = '100%'
          colInput.addEventListener('input', function () {
            importState.files[idx].collectionName = colInput.value
          })
          colGroup.appendChild(colLabel)
          colGroup.appendChild(colInput)

          // Mode name
          var modeGroup = document.createElement('div')
          var modeLabel = document.createElement('div')
          modeLabel.className = 'import-field-label'
          modeLabel.textContent = 'Mode'
          var modeInput = document.createElement('input')
          modeInput.type = 'text'
          modeInput.className = 'text-input'
          modeInput.setAttribute('aria-label', 'Mode name for ' + file.fileName)
          modeInput.value = file.modeName
          modeInput.style.width = '100%'
          modeInput.addEventListener('input', function () {
            importState.files[idx].modeName = modeInput.value
          })
          modeGroup.appendChild(modeLabel)
          modeGroup.appendChild(modeInput)

          fields.appendChild(colGroup)
          fields.appendChild(modeGroup)
          card.appendChild(fields)

          elImportFileList.appendChild(card)
        })

        updateImportButtons()
      }

      // =======================================================================
      // IMPORT — Button handlers
      // =======================================================================
      elBtnImportClear.addEventListener('click', function () {
        importState.files = []
        clearImportMessages()
        renderImport()
      })

      elBtnImport.addEventListener('click', function () {
        clearImportMessages()
        elBtnImport.disabled = true
        elBtnImport.textContent = 'Importing\u2026'

        var payload = importState.files.map(function (f) {
          return {
            fileName: f.fileName,
            content: f.content,
            collectionName: f.collectionName,
            modeName: f.modeName,
          }
        })
        parent.postMessage({ pluginMessage: { type: 'import', files: payload } }, '*')
      })

      // =======================================================================
      // Message handler (from code.ts)
      // =======================================================================
      window.onmessage = function (event) {
        var msg = event.data.pluginMessage
        if (!msg) return

        if (msg.type === 'collections-loaded') {
          exportState.mappings = msg.mappings
          exportState.totalTokenCount = msg.totalTokenCount
          elExportLoading.classList.add('hidden')
          elExportMain.classList.remove('hidden')
          renderExport()
        } else if (msg.type === 'export-ready') {
          if (activeExportBtn) {
            activeExportBtn.disabled = false
            activeExportBtn.textContent = 'Export'
            activeExportBtn = null
          }

          var files = msg.files
          if (files.length === 0) {
            showMsg(elExportError, 'No files to export.')
            return
          }

          showWarningsList(elExportWarning, msg.warnings)
          downloadJson(files[0].fileName, files[0].content)
          showMsg(
            elExportSuccess,
            'Exported ' + files[0].fileName + ' \u2014 ' + files[0].tokenCount + ' tokens.'
          )
        } else if (msg.type === 'import-complete') {
          elBtnImport.disabled = false
          elBtnImport.textContent = 'Import JSON'

          var r = msg.result
          showWarningsList(elImportWarning, r.warnings)

          var parts = []
          if (r.created > 0) parts.push(r.created + ' created')
          if (r.updated > 0) parts.push(r.updated + ' updated')
          if (r.skipped > 0) parts.push(r.skipped + ' skipped')
          showMsg(elImportSuccess, 'Import complete \u2014 ' + parts.join(', ') + '.')

          // Clear files after successful import
          importState.files = []
          renderImport()
        } else if (msg.type === 'error') {
          // Reset export and import buttons
          if (activeExportBtn) {
            activeExportBtn.disabled = false
            activeExportBtn.textContent = 'Export'
            activeExportBtn = null
          }
          elBtnImport.disabled = false
          elBtnImport.textContent = 'Import JSON'
          // Show error on whichever tab is active
          var activeTab = document.querySelector('.tab-btn.active')
          if (activeTab && activeTab.dataset.tab === 'import') {
            showMsg(elImportError, msg.message || 'An unexpected error occurred.')
          } else {
            showMsg(elExportError, msg.message || 'An unexpected error occurred.')
          }
        }
      }

      // =======================================================================
      // Init — load collections for export tab
      // =======================================================================
      parent.postMessage({ pluginMessage: { type: 'load-collections' } }, '*')
    </script>
  </body>
</html>
